name: Auto Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch existing tags
        run: git fetch --tags --force origin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Compute next available patch version from package.json
        id: bump
        shell: bash
        run: |
          bun -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            const pkgPath = "package.json";
            if (!fs.existsSync(pkgPath)) {
              throw new Error("Missing package.json");
            }

            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const current = String(pkg.version || "0.1.1").trim();
            const match = current.match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) {
              throw new Error(`Invalid semver in package.json: "${current}"`);
            }

            const major = Number(match[1]);
            const minor = Number(match[2]);
            let patch = Number(match[3]) + 1;
            let next = `${major}.${minor}.${patch}`;

            const tagExists = (ver) => {
              const tag = `v${ver}`;
              try {
                execSync(`git rev-parse -q --verify "refs/tags/${tag}"`, { stdio: "ignore" });
                return true;
              } catch {}
              try {
                const remoteOut = execSync(`git ls-remote --tags origin "refs/tags/${tag}"`, {
                  encoding: "utf8",
                }).trim();
                return remoteOut.length > 0;
              } catch {
                return false;
              }
            };

            while (tagExists(next)) {
              patch += 1;
              next = `${major}.${minor}.${patch}`;
            }

            pkg.version = next;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            const tauriPath = "src-tauri/tauri.conf.json";
            if (fs.existsSync(tauriPath)) {
              const tauriConf = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
              tauriConf.version = next;
              fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + "\n");
            }

            const cargoPath = "src-tauri/Cargo.toml";
            if (fs.existsSync(cargoPath)) {
              let cargoToml = fs.readFileSync(cargoPath, "utf8");
              cargoToml = cargoToml.replace(
                /^version\s*=\s*"[^"]+"/m,
                `version = "${next}"`
              );
              fs.writeFileSync(cargoPath, cargoToml);
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `new_version=${next}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag_name=v${next}\n`);
          '

      - name: Commit version bump, push main and push tag
        id: git_push
        shell: bash
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          TAG_NAME: ${{ steps.bump.outputs.tag_name }}
        run: |
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || -z "$TAG_NAME" || "$TAG_NAME" == "v" ]]; then
            echo "ERROR: Invalid version/tag computed: version='$NEW_VERSION' tag='$TAG_NAME'" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json
          [[ -f src-tauri/tauri.conf.json ]] && git add src-tauri/tauri.conf.json
          [[ -f src-tauri/Cargo.toml ]] && git add src-tauri/Cargo.toml

          git commit -m "chore(release): bump version to ${TAG_NAME} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Trigger Release workflow for new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.bump.outputs.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Refusing to trigger release for TAG_NAME='$TAG_NAME'." >&2
            exit 1
          fi
          gh workflow run release.yml --ref main -f tag="${TAG_NAME}"