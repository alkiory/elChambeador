
name: Auto Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch existing tags
        run: git fetch --tags --force origin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Compute next version
        id: bump
        shell: bash
        run: |
          bun -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const current = String(pkg.version || "0.1.1");
            const match = current.match(/^(\d+)\.(\d+)\.(\d+)$/);

            if (!match) {
              throw new Error(`Invalid version: ${current}`);
            }

            const major = Number(match[1]);
            const minor = Number(match[2]);
            let patch = Number(match[3]) + 1;

            const tagExists = (version) => {
              const tag = `v${version}`;

              try {
                execSync(`git rev-parse -q --verify refs/tags/${tag}`, {
                  stdio: "ignore"
                });
                return true;
              } catch {}

              try {
                return execSync(
                  `git ls-remote --tags origin refs/tags/${tag}`,
                  { encoding: "utf8" }
                ).trim().length > 0;
              } catch {
                return false;
              }
            };

            let next = `${major}.${minor}.${patch}`;

            while (tagExists(next)) {
              patch++;
              next = `${major}.${minor}.${patch}`;
            }

            pkg.version = next;
            fs.writeFileSync(
              "package.json",
              JSON.stringify(pkg, null, 2) + "\n"
            );

            const tauriPath = "src-tauri/tauri.conf.json";

            if (fs.existsSync(tauriPath)) {
              const config = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
              config.version = next;
              fs.writeFileSync(
                tauriPath,
                JSON.stringify(config, null, 2) + "\n"
              );
            }

            const cargoPath = "src-tauri/Cargo.toml";

            if (fs.existsSync(cargoPath)) {
              let cargo = fs.readFileSync(cargoPath, "utf8");
              cargo = cargo.replace(
                /^version\s*=\s*"[^"]+"/m,
                `version = "${next}"`
              );
              fs.writeFileSync(cargoPath, cargo);
            }

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `new_version=${next}\ntag_name=v${next}\n`
            );
          '

      - name: Commit version and create tag
        shell: bash
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          TAG_NAME: ${{ steps.bump.outputs.tag_name }}
        run: |
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $NEW_VERSION"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json
          git add src-tauri/tauri.conf.json
          git add src-tauri/Cargo.toml

          git commit -m "chore(release): bump version to ${TAG_NAME} [skip ci]"
          git push origin HEAD:main

          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.bump.outputs.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi

          gh workflow run release.yml \
            --ref main \
            -f tag="$TAG_NAME"

          echo "Release workflow triggered for $TAG_NAME"
